# 云端出包 + 自动发版：push main 后自动构建 Windows 安装包与 Android APK，
# 覆盖到 latest Release。App 端按平台挑资产（.zip / .apk），共用同一元数据。
name: build-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # gh release create/upload 必需

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 版本号 = 提交数，必须全量历史

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1 # 与本机一致，避免引擎/Gradle 版本漂移
          cache: true

      - name: Flutter 版本确认
        run: flutter --version

      - name: 静态检查
        run: flutter analyze --no-fatal-infos

      - name: 单元测试
        run: flutter test

      - name: 预取 Windows 原生依赖（CI 直连，不走镜像）
        shell: bash
        run: bash tool/fetch-windows-native-deps.sh

      - name: 构建 Windows Release
        shell: bash
        run: |
          N=$(git rev-list --count HEAD)
          echo "versionCode=$N versionName=0.1.$N"
          flutter build windows --release --build-name=0.1.$N --build-number=$N

      - name: 打包 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/peixi-windows-x64.zip -Force

      - name: 构建 Android Release（arm64）
        shell: bash
        run: |
          mkdir -p dist
          N=$(git rev-list --count HEAD)
          flutter build apk --release --target-platform android-arm64 \
            --build-name=0.1.$N --build-number=$N
          cp build/app/outputs/flutter-apk/app-release.apk dist/peixi-android-arm64.apk

      - name: 发布到 latest Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          N=$(git rev-list --count HEAD)
          REPO="$GITHUB_REPOSITORY"
          {
            echo "<!-- appupdate versionCode=$N versionName=0.1.$N -->"
            echo
            echo "## 更新内容"
            echo
            git log -5 --pretty=format:'- %s'
          } > notes.md
          ASSETS="dist/peixi-windows-x64.zip dist/peixi-android-arm64.apk"
          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            gh release upload latest $ASSETS --clobber --repo "$REPO"
            gh release edit latest --title "最新版 0.1.$N" --notes-file notes.md --repo "$REPO"
            echo "已覆盖更新 latest（0.1.$N，Windows + Android）"
          else
            gh release create latest $ASSETS \
              --title "最新版 0.1.$N" --notes-file notes.md --repo "$REPO"
            echo "已创建 latest（0.1.$N，Windows + Android）"
          fi
